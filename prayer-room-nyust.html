const SA=["drop","kaaba","stand","bow","prost","sit"];const art=i=>i<2?ic(SA[i]).replace('class="i"','class="i" style="width:56px;height:56px"'):fig(SA[i]);

const T={
zh:{
a:{nav:"主要章節",lang:"語言"},
nav:[["room","禮拜室"],["pray","禮拜"],["islam","伊斯蘭"],["faq","問答"],["go","深入了解"]],navC:["contact","聯絡"],
h1:"歡迎來到 YunTech 穆斯林禮拜室",gr:"「願你平安」，這是穆斯林的問候語",hp:"這是穆斯林同學禮拜的地方。花兩分鐘，認識這裡，也認識我們的信仰。",
qs:[["這是什麼地方？","room"],["他們在做什麼？","pray"],["什麼是伊斯蘭？","islam"]],q4:[["常見問題","faq"],["我可以提問嗎？","contact"]],
V:{note:["禮拜室須依學校規定使用。請不要打擾正在禮拜的人，也請不要拍攝禮拜中的人。","參觀前請先與我們聯絡，並遵守學校與禮拜室的規定。請不要打擾正在禮拜的人，也請不要拍攝禮拜中的人。"],visit:["是否可以進入，須依學校與禮拜室的規定。若獲准進入，請脫鞋、保持安靜，不要走過正在禮拜的人面前，也請不要拍攝禮拜中的人。","歡迎，但請先與我們聯絡，並遵守學校與禮拜室的規定。進入時請脫鞋、保持安靜，不要走過正在禮拜的人面前，也請不要拍攝禮拜中的人。"]},
room:{t:"這間禮拜室是什麼地方？",p:"這是校內讓穆斯林同學禮拜的安靜空間。穆斯林每天禮拜五次，同學會依禮拜時間來這裡。",c:[["people","誰會來","來自不同國家的穆斯林同學。"],["room","這裡有什麼","大家脫鞋進入，一起或各自禮拜。"],["ask","你可以做什麼","了解穆斯林同學的信仰與日常，也歡迎友善交流與提問。"]]},
who:{t:"穆斯林是誰？",p:"穆斯林是信奉伊斯蘭的人。伊斯蘭是一個以敬拜、順從獨一真主（阿拉伯語 Allah）為核心的宗教。穆斯林相信真主創造宇宙，並藉由使者引導人類。",c:["全球約有二十億穆斯林，遍布世界各地。","穆斯林不只有阿拉伯人，亞洲就有許多穆斯林，如印尼、巴基斯坦與孟加拉。","臺灣也有本地穆斯林，臺灣人當然也可以成為穆斯林。"]},
pray:{t:"穆斯林禮拜時在做什麼？",p:"禮拜是穆斯林最重要的日常敬拜，穆斯林相信這是真主的命令，不只是冥想或放鬆。許多人也覺得禮拜讓內心安定、專注，但這不是它主要的意義。",s:[["先清洗","禮拜前，穆斯林會依規定清洗身體的特定部位（稱為小淨），並穿著整潔端莊。"],["面向天房","全世界的穆斯林都朝向麥加禁寺（內有天房 Kaaba）的方向（古蘭經 2:144）。穆斯林崇拜的是真主，不是這座建築。"],["站立","站著念「真主至大」，並誦讀古蘭經的經文。"],["鞠躬","彎腰鞠躬，表達對真主的恭敬。"],["叩頭","額頭、鼻子、雙手、膝蓋與腳趾觸地，是最謙卑的姿勢。"],["端坐","坐下念祈禱與讚頌的話，最後向右、向左說「願你平安」。"]],cap:"示意圖為簡化人形，不代表任何真人。每次禮拜的單元數與時間長短不同。",wm:"禮拜前怎麼清洗？",wd:"古蘭經 5:6 提到：洗臉、洗雙手（臂）至手肘、以濕手擦過頭部、洗腳至腳踝。依先知的教導，還會先洗手、漱口並清洗鼻腔。這只是簡要說明，詳細規定請向懂的人請教。"},
islam:{t:"認識伊斯蘭",p:"從四個最基本的概念開始。",more:"了解更多",c:[["star","真主（Allah）","「Allah」是阿拉伯語的「神」，並不是只屬於阿拉伯人的另一位神。伊斯蘭教導：真主是萬物唯一的創造者，獨一無二，沒有夥伴。","古蘭經第 112 章：祂是獨一的，不需要任何事物，不生也不被生，沒有任何事物能與祂相比。"],["book","古蘭經","穆斯林相信古蘭經是真主啟示給先知穆罕默德的話語，原文為阿拉伯語。","穆斯林相信真主保護古蘭經不被改變（古蘭經 15:9）。"],["moon","先知穆罕默德","約西元 570 年生於麥加，穆斯林相信他是真主的最後一位使者。穆斯林只崇拜真主，不崇拜穆罕默德。","穆斯林提到先知時會說「願真主賜他平安」。穆斯林也尊敬亞當、挪亞、亞伯拉罕、摩西與耶穌等先知，認為他們都傳達同樣的核心訊息：只敬拜真主（古蘭經 16:36）。"],["ask","人生的意義","穆斯林相信人活著有目的：認識並敬拜真主、負責任地生活，並為來世做準備。 <a href='#wonder'>看看伊斯蘭的回答 →</a>"]]},
wonder:{t:"你是否想過？",p:"這些問題，每個人都可能想過。以下是伊斯蘭的回答。",q:[["宇宙是誰創造的？","穆斯林相信宇宙由獨一的真主創造。古蘭經邀請人觀察天地的創造與日夜更替（2:164）。這是伊斯蘭的教導與思考的起點，不是科學證明。"],["我為什麼在這裡？人生有目的嗎？","伊斯蘭教導：人類是為了敬拜真主而被創造（51:56）。敬拜包括禮拜、齋戒等明確的宗教功課，也包括依照真主的指引生活。許多學者也說明，正當的日常行為若出於為真主的意念，例如誠實工作、孝順父母、幫助他人，也可成為敬拜（參考《布哈里聖訓集》第 1 號：行為依意念而定）。"],["死後會怎樣？","穆斯林相信死亡不是結束（3:185），之後會復活並接受審判，連微小的善與惡都不會被忽略（99:7–8）。"]]},
life:{t:"穆斯林的日常",p:"信仰如何影響日常生活。",pt:"每天五次禮拜",pp:"穆斯林每天在五個規定的時段禮拜（古蘭經 4:103），時段依太陽的位置而定，所以每天略有不同；每次禮拜的長短也不同。",chips:["黎明（日出前）· Fajr","中午過後 · Dhuhr","下午 · Asr","日落後 · Maghrib","夜晚 · Isha"],c:[["moon","齋戒月","伊斯蘭曆的一個月。成年且有能力的穆斯林從黎明到日落不吃不喝，也要克制不良言行。生病、旅行等情況有不同的規定，例如暫緩後補齋，或依情況有其他替代方式，詳情請向懂的人請教（古蘭經 2:183–187）。"],["ok","清真（Halal）","意思是「被允許的」，不只飲食，也涵蓋行為與生活。飲食上，穆斯林不吃豬肉、不喝使人醉的酒，肉類須依規定宰殺（古蘭經 2:173、5:90）。所以穆斯林同學常會詢問食物成分。"],["heart","天課與慈善","天課（Zakat）是財富達到規定標準、並符合相關條件的穆斯林每年應繳的義務捐獻，並非每位穆斯林都必須繳納；受助對象包括貧困者等（古蘭經 9:60）。人人也被鼓勵自願布施與助人。"],["people","家庭與品格","善待父母，尤其在他們年老時（古蘭經 17:23）；重視誠實與守信。古蘭經要求人即使不利於自己，也要堅持公正（4:135）。"]],pm:"五功與六信",pl:"<p><b>五功</b>：伊斯蘭的五項根基（《布哈里聖訓集》第 8 號）</p><ol><li>作證言：只有真主值得崇拜，穆罕默德是祂的使者</li><li>禮拜</li><li>天課（財力達標者的義務捐獻）</li><li>朝覲麥加（有能力者）</li><li>齋戒月的齋戒</li></ol><p><b>六信</b>：信仰的六項內容（《穆斯林聖訓集》第 8 號）</p><ol><li>信真主</li><li>信天使</li><li>信經典（如古蘭經）</li><li>信使者</li><li>信末日（復活與審判）</li><li>信前定（真主對一切的全知與前定）</li></ol>"},
faq:{t:"你可能想問…",p:"點選問題，了解更多。任何疑問都歡迎提出！",g:[["日常問題",[["伊斯蘭只屬於阿拉伯人嗎？","不是。穆斯林來自各個民族與文化，亞洲有許多穆斯林，臺灣也有本地穆斯林。"],["穆斯林為什麼要禮拜？","穆斯林相信禮拜是真主的命令，是向創造者表達敬拜、感謝與祈求（4:103）。"],["為什麼不吃豬肉？","穆斯林相信這是真主的明確規定（古蘭經 2:173），遵守是出於順從。清真飲食也包括不喝酒與符合規定的肉類。"],["為什麼有些穆斯林女生戴頭巾？","主流的伊斯蘭學者認為，成年穆斯林女性應穿著端莊、遮蓋頭髮與身體（臉與雙手通常除外），依據是古蘭經 24:31、33:59 與聖訓；學者對某些細節有不同看法。實際穿著因人而異，請以尊重的態度對待每一位穆斯林女性。"],["我可以參觀禮拜室嗎？","{visit}"],["穆斯林相信耶穌嗎？","相信，並且尊敬他。穆斯林相信耶穌是真主的先知與彌賽亞（al-Masih），由童貞女馬利亞奇蹟地生下（古蘭經 3:45–47），但不把他當作神或神之子來崇拜。"],["伊斯蘭教導暴力嗎？","伊斯蘭重視無辜生命的神聖。古蘭經 5:32 在對以色列後裔的訓諭中說：無故殺害一人，如同殺害全人類，救一人如同救全人類（除非是為了償命，或對付在地上製造嚴重禍亂者）。主流穆斯林學者譴責殺害無辜與恐怖主義。戰爭與政治是複雜的議題，無法用一句話概括。"]]],["關於信仰的問題",[["穆斯林為什麼相信只有一位神？","穆斯林相信真主是萬物唯一的創造者，祂沒有夥伴、沒有同等者，唯有祂值得被崇拜。這個信仰稱為「獨一論」（Tawhid），是伊斯蘭的根基。古蘭經說真主是獨一的，且與受造物毫無相似之處（2:163；112:1–4）。"],["古蘭經是什麼？","古蘭經是伊斯蘭的經典。穆斯林相信它是真主的話語，由天使哲卜拉伊勒（Gabriel）在約 23 年間啟示給先知穆罕默德。內容涵蓋真主、敬拜、良好品格、人生的目的與來世。原文是阿拉伯語，譯本能幫助人理解其意義。"],["為什麼穆斯林相信古蘭經是啟示？","這主要是信仰上的理由：古蘭經自稱來自真主（例如 2:23 挑戰人寫出類似的章）；穆斯林認為它在語言上無可比擬，內容與歷代先知的核心訊息一致，並相信先知穆罕默德誠實可信。"],["死後會怎樣？","穆斯林相信死亡不是結束。在末日，所有人都會復活，並在公正的真主面前接受審判（3:185；99:7–8）。信仰並行善的人被許諾進入天堂，否認真理並作惡的人將受懲罰；穆斯林也強調真主的慈憫與寬恕。"],["臺灣人可以成為穆斯林嗎？","可以。伊斯蘭與國籍、民族無關。"],["需要懂阿拉伯語嗎？","不需要。不必會阿拉伯語，就可以認識伊斯蘭，也可以成為穆斯林。禮拜中的誦讀使用阿拉伯語，可以從短句開始，逐步學習。"],["如何成為穆斯林？","真誠相信只有真主值得崇拜、穆罕默德是祂的使者，並說出作證言（見「想深入了解」），就成為穆斯林。不需要特別的儀式或伊瑪目（宗教領袖）在場。新穆斯林可以逐步學習禮拜與其他實踐。"]]]]},
go:{t:"想更深入了解伊斯蘭？",p:"給想進一步了解伊斯蘭信仰的人。",d:[["先知穆罕默德帶來什麼訊息？","穆斯林相信他約 40 歲（約西元 610 年）開始接受啟示，傳達：只敬拜獨一的真主、行善與公正、相信死後的審判。他於西元 632 年逝世。"],["怎麼閱讀古蘭經？","可上網閱讀譯本（見延伸閱讀）。譯本只傳達意義，建議先從第 1 章與第 112 章等短章開始。"]],sh:"作證言：信仰的核心宣告",shp:"穆斯林相信只有真主值得崇拜，穆罕默德是祂的使者。這個宣告只有兩句話：",shT:"我作證：除了真主以外，沒有值得崇拜的對象；我也作證：穆罕默德是真主的使者。",shn:"發音可請教穆斯林朋友，或到可靠的網站聆聽。"},
more:{t:"延伸閱讀",p:"精選少數可靠來源",r:[["古蘭經 Quran.com","可線上閱讀古蘭經，有阿拉伯原文、多種語言的譯本與朗讀。","https://quran.com"],["聖訓 Sunnah.com","查詢先知穆罕默德言行（聖訓）的阿拉伯原文、英文及出處。","https://sunnah.com"],["入門指南（英文）","MyMasjid 網站的英文入門指南《Beginner’s Guide to Understanding Islam》，分五章。","https://www.mymasjid.ca/beginners-guide-understanding-islam/"],["台北清真寺（臺北旅遊網）","位於臺北市大安區新生南路二段 62 號，建於 1960 年。參訪請遵守清真寺規定（主禮拜殿僅限穆斯林進入），行前請先確認開放時間。","https://www.travel.taipei/en/attraction/details/501"]]},
co:{t:"有問題？來聊聊",p:"歡迎提問或詢問參觀。看這個網站不需要留下任何個人資料。",l:{email:"電子郵件",line:"LINE",ig:"Instagram",loc:"位置",hrs:"開放時間"}},
foot:"本網站由國立雲林科技大學（YunTech）的穆斯林學生自發製作，並非學校官方網站，內容是穆斯林學生對伊斯蘭的介紹。經文引用為大意，並非逐字翻譯。",title:"認識伊斯蘭 · YunTech 穆斯林禮拜室"},

h1:"Welcome to the YunTech Muslim Prayer Room",gr:"“Peace be upon you”: the Muslim greeting",hp:"This is where Muslim students pray. Take two minutes to learn about this space and our faith.",
qs:[["What is this place?","room"],["What are they doing?","pray"],["What is Islam?","islam"]],q4:[["Common questions","faq"],["Can I ask questions?","contact"]],
V:{note:["The prayer room must be used in line with university rules. Please don’t disturb people who are praying, and please don’t photograph them.","Please contact us before visiting, and follow university and prayer room rules. Please don’t disturb people who are praying, and please don’t photograph them."],visit:["Whether you may enter depends on university and prayer room rules. If you are allowed in, take off your shoes, stay quiet, don’t walk in front of anyone praying, and please don’t photograph people at prayer.","You’re welcome, but please contact us first and follow university and prayer room rules. Take off your shoes, stay quiet, don’t walk in front of anyone praying, and please don’t photograph people at prayer."]},
room:{t:"What is this prayer room?",p:"A quiet space on campus where Muslim students pray. Muslims pray five times a day, so students come here at prayer times.",c:[["people","Who comes","Muslim students from many countries."],["room","What’s inside","People take off their shoes, then pray together or alone."],["ask","What you can do","Learn about Muslim students’ faith and daily life, and feel free to ask questions and talk."]]},
who:{t:"Who are Muslims?",p:"A Muslim is a person who follows Islam, a religion centered on worshipping and submitting to one God (Allah in Arabic). Muslims believe God created the universe and guides humanity through His messengers.",c:["There are about two billion Muslims, living all over the world.","Muslims aren’t only Arabs. Many are Asian, for example from Indonesia, Pakistan and Bangladesh.","Taiwan has local Muslims, and Taiwanese people can of course become Muslim too."]},
pray:{t:"What happens when Muslims pray?",p:"Prayer is the most important daily act of worship in Islam. Muslims believe God commanded it; it is not just meditation or relaxation. Many find it calming and focusing, but that isn’t its main meaning.",s:[["Wash first","Before praying, Muslims wash certain parts of the body in a set way (called wudu) and dress neatly and modestly."],["Face the Kaaba","Muslims everywhere face the direction of the Sacred Mosque in Mecca, which houses the Kaaba (Quran 2:144). They worship God, not the building."],["Stand","Standing, they say “God is the Greatest” and recite verses from the Quran."],["Bow","Bending at the waist shows reverence to God."],["Prostrate","Forehead, nose, palms, knees and toes touch the ground, the humblest posture."],["Sit","Sitting, they say prayers of praise and end by saying “peace be upon you” to the right, then the left."]],cap:"Figures are simplified drawings, not real people. The number of units and length vary between prayers.",wm:"How do they wash before prayer?",wd:"Quran 5:6 mentions washing the face and the arms to the elbows, wiping the head with wet hands, and washing the feet to the ankles. Following the Prophet’s teaching, Muslims also begin by washing the hands and rinsing the mouth and nose. This is only a short summary, so ask someone knowledgeable for the full rules."},
islam:{t:"Discover Islam",p:"Starting with four basic ideas.",more:"Learn more",c:[["star","Allah","“Allah” is simply the Arabic word for God, not a separate deity for Arabs. Islam teaches that He is the one Creator of everything, unique and without partners.","Quran chapter 112: He is One, self-sufficient, neither begetting nor begotten, and nothing is comparable to Him."],["book","The Quran","Muslims believe the Quran is Allah’s word revealed to Prophet Muhammad, in Arabic.","Muslims believe Allah protects the Quran from change (Quran 15:9)."],["moon","Prophet Muhammad","Born in Mecca around 570 CE. Muslims believe he was Allah’s final messenger. They worship Allah alone, not Muhammad.","Muslims say “peace be upon him” when mentioning the Prophet. They also honor prophets like Adam, Noah, Abraham, Moses and Jesus, who they believe brought the same core message: worship Allah alone (Quran 16:36)."],["ask","Meaning of life","Muslims believe life has a purpose: to know and worship Allah, live responsibly, and prepare for the life to come. <a href='#wonder'>See Islam’s answers →</a>"]]},
wonder:{t:"Have you ever wondered?",p:"Everyone asks these questions. Here are Islam’s answers.",q:[["Who created the universe?","Muslims believe one God, Allah, created it. The Quran invites people to reflect on creation and the alternation of night and day (2:164). This is Islamic teaching and a starting point for reflection, not scientific proof."],["Why am I here? Does life have a purpose?","Islam teaches that humans were created to worship Allah (51:56). Worship includes clear acts such as prayer and fasting, and also living by Allah’s guidance. Many scholars explain that permissible everyday actions done with the intention of pleasing Allah, such as honest work, caring for parents and helping others, can also become worship (see Sahih al-Bukhari 1: actions are judged by intentions)."],["What happens after death?","Muslims believe death isn’t the end (3:185). People will be resurrected and judged, and even tiny good or bad deeds are not overlooked (99:7–8)."]]},
life:{t:"A Muslim’s daily life",p:"How faith shapes everyday living.",pt:"Five daily prayers",pp:"Muslims pray at five prescribed times each day (Quran 4:103), set by the sun’s position, so they shift a little each day. Prayers also differ in length.",chips:["Dawn (before sunrise) · Fajr","After midday · Dhuhr","Afternoon · Asr","After sunset · Maghrib","Night · Isha"],c:[["moon","Ramadan","A month in the Islamic calendar. Healthy adult Muslims go without food and drink from dawn to sunset and also guard their words and conduct. Illness, travel and some other situations have different rulings, such as postponing and making up the fast or other alternatives; ask someone knowledgeable for details (Quran 2:183–187)."],["ok","Halal","Means “permitted” and covers more than food: behavior and lifestyle too. In diet, Muslims avoid pork and intoxicating drinks, and meat must be slaughtered in a prescribed way (Quran 2:173, 5:90). That’s why Muslim friends may ask about ingredients."],["heart","Zakat and charity","Zakat is an obligatory yearly charity for Muslims whose wealth meets the set threshold and conditions. It is not required of every Muslim regardless of means. Recipients include the poor and needy (Quran 9:60). Everyone is also encouraged to give voluntarily and help others."],["people","Family and character","Be kind to parents, especially in old age (Quran 17:23), and value honesty and keeping promises. The Quran says to stand for justice even against oneself (4:135)."]],pm:"The Five Pillars and Six Articles of Faith",pl:"<p><b>Five Pillars</b>: the five foundations of Islam (Sahih al-Bukhari 8)</p><ol><li>The declaration of faith: none is worthy of worship but Allah, and Muhammad is His Messenger</li><li>Prayer</li><li>Zakat (obligatory charity for those who meet the wealth conditions)</li><li>Pilgrimage to Mecca (for those able)</li><li>Fasting in Ramadan</li></ol><p><b>Six Articles of Faith</b>: what Muslims believe (Sahih Muslim 8)</p><ol><li>Allah</li><li>His angels</li><li>His books (such as the Quran)</li><li>His messengers</li><li>The Last Day (resurrection and judgment)</li><li>Divine decree (Allah’s knowledge and decree of all things)</li></ol>"},
faq:{t:"Questions you may have",p:"Tap a question to learn more. All questions are welcome!",g:[["Everyday questions",[["Is Islam only for Arabs?","No. Muslims come from every ethnicity and culture. Many are Asian, and Taiwan has local Muslims."],["Why do Muslims pray?","Muslims believe prayer is commanded by Allah, as worship, thanks and asking for help from the Creator (4:103)."],["Why no pork?","Muslims believe this is a clear command from Allah (Quran 2:173), followed out of obedience. Halal eating also means no alcohol and meat prepared in the prescribed way."],["Why do some Muslim women wear hijab?","Mainstream Islamic scholars hold that adult Muslim women should dress modestly and cover the hair and body (the face and hands are usually excepted), based on Quran 24:31, 33:59 and hadith; scholars differ on some details. In practice women dress in different ways, so please treat every Muslim woman with respect."],["Can I visit the prayer room?","{visit}"],["Do Muslims believe in Jesus?","Yes, and they honor him. Muslims believe Jesus is a prophet and the Messiah (al-Masih) of Allah, miraculously born to the Virgin Mary (Quran 3:45–47), but they don’t worship him as God or the Son of God."],["Does Islam teach violence?","Islam holds innocent life sacred. In a decree given to the Children of Israel, Quran 5:32 says killing a person unjustly is like killing all humanity and saving one life is like saving all (except as punishment for murder or for spreading serious corruption in the land). Mainstream Muslim scholars condemn killing innocents and terrorism. War and politics are complex and can’t be summed up in a sentence."]]],["Questions about faith",[["Why do Muslims believe in one God?","Muslims believe Allah is the one Creator of everything. He has no partners or equals, and He alone deserves worship. This belief is called Tawhid, the foundation of Islam. The Quran describes Allah as One and unlike anything in creation (2:163; 112:1–4)."],["What is the Quran?","The Quran is the holy book of Islam. Muslims believe it is the word of Allah, revealed to Prophet Muhammad through the Angel Gabriel over approximately 23 years. It teaches about God, worship, good character, the purpose of life, and the Hereafter. Its original language is Arabic, and translations help people understand its meaning."],["Why do Muslims believe the Quran is revelation?","The reasons are mainly matters of faith: the Quran presents itself as from Allah (for example, 2:23 challenges people to produce a similar chapter); Muslims regard its language as unmatched, its message as consistent with the earlier prophets, and Muhammad as truthful."],["What happens after death?","Muslims believe death is not the end. On the Last Day, all people will be resurrected and judged by the just Allah (3:185; 99:7–8). Those who believed and did good are promised Paradise, while those who rejected the truth and did wrong face punishment; Muslims also stress Allah’s mercy and forgiveness."],["Can someone from Taiwan become Muslim?","Yes. Islam isn’t tied to nationality or ethnicity."],["Do I need to know Arabic?","No. You don’t need Arabic to learn about Islam or become Muslim. The recitation in prayer is in Arabic, and you can learn it gradually, starting with short phrases."],["How does someone become Muslim?","A person becomes Muslim by sincerely believing that Allah alone deserves worship and that Muhammad is His Messenger, and by declaring the Shahada (declaration of faith; see “Want to go deeper?”). No special ceremony or imam is required. A new Muslim can learn prayer and other practices gradually."]]]]},
go:{t:"Want to explore Islam further?",p:"For those who want to understand the Islamic faith more deeply.",d:[["What was Prophet Muhammad’s message?","Muslims believe revelation began when he was about 40 (around 610 CE). He taught: worship Allah alone, do good and justice, and believe in judgment after death. He died in 632 CE."],["How do I read the Quran?","Read a translation online (see Further reading). Translations convey meaning only; try short chapters first, like chapters 1 and 112."]],sh:"The Shahada: the central declaration of faith",shp:"Muslims believe only Allah is worthy of worship and Muhammad is His Messenger. The declaration has just two sentences:",shT:"I bear witness that none is worthy of worship except Allah, and I bear witness that Muhammad is the Messenger of Allah.",shn:"Ask a Muslim friend for pronunciation, or listen on a trusted site."},
more:{t:"Further reading",p:"A few reliable sources",r:[["Quran.com","Read the Quran online with the Arabic text, translations in many languages, and audio.","https://quran.com"],["Sunnah.com","Look up the Prophet Muhammad’s sayings (hadith) in Arabic and English, with sources.","https://sunnah.com"],["Beginner’s guide","“Beginner’s Guide to Understanding Islam” from MyMasjid, in five chapters.","https://www.mymasjid.ca/beginners-guide-understanding-islam/"],["Taipei Grand Mosque (Travel Taipei)","At No. 62, Sec. 2, Xinsheng S. Rd., Da’an District, Taipei; built in 1960. Please follow the mosque’s rules (only Muslims may enter the main prayer hall) and confirm opening hours before going.","https://www.travel.taipei/en/attraction/details/501"]]},

foot:"Made by Muslim students at National Yunlin University of Science and Technology (YunTech) as a student initiative, not an official university website. It introduces Islam from Muslim students’ perspective. Quran references give the meaning, not word-for-word translations.",title:"Discover Islam · YunTech Muslim Prayer Room"}};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const HAS=!!(CONFIG.email||CONFIG.line||CONFIG.instagram);
const sec=(id,h,p,body,cls="")=>`<section id="${id}" class="${cls}"><h2>${h}</h2><p class="sub">${p}</p>${body}</section>`;
const det=(q,a)=>`<details><summary>${q}</summary><div>${a[0]==="<"?a:`<p>${a}</p>`}</div></details>`;
function contact(g,C){
 const k=CONFIG,r=[];
 if(k.location[g])r.push(`${C.l.loc}: ${esc(k.location[g])}`);
 if(k.hours[g])r.push(`${C.l.hrs}: ${esc(k.hours[g])}`);
 if(k.email)r.push(`${C.l.email}: <a href="mailto:${esc(k.email)}">${esc(k.email)}</a>`);
 if(k.line)r.push(`${C.l.line}: ${/^https:\/\//.test(k.line)?`<a href="${esc(k.line)}" rel="noopener">${esc(k.line)}</a>`:esc(k.line)}`);
 if(k.instagram){const h=k.instagram.replace(/^@/,"");r.push(`${C.l.ig}: <a href="https://www.instagram.com/${encodeURIComponent(h)}/" target="_blank" rel="noopener">@${esc(h)}</a>`)}
 return r.map(x=>`<p>${x}</p>`).join("");
}
